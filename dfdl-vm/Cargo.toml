[package]
name = "dfdl-vm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "no_std DFDL virtual machine: XSD → in-memory IR → encode/decode"
readme = "README.md"

[features]
default = []
std = []

[dependencies]
regex-automata = { version = "0.4.18", default-features = false, features = ["alloc", "syntax", "unicode", "nfa-thompson", "meta"] }
xml-no-std = "0.8.26"

[dev-dependencies]
